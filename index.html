<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    /* light — warm paper ground, ink text */
    --bg: #f3efe7;
    --panel: #fbf9f4;
    --ink: #26221c;
    --muted: #7a7264;
    --hair: #e4ddd0;
    --track: #e7e0d3;
    --shadow: 0 1px 2px rgba(38,34,28,.05), 0 12px 40px rgba(38,34,28,.08);
    /* per-mode accents (state = color) */
    --focus: #d1553a;
    --focus-soft: #f6e2da;
    --short: #2f8f7f;
    --short-soft: #d9ece7;
    --long: #3f6fb0;
    --long-soft: #dde7f3;
    --accent: var(--focus);
    --accent-soft: var(--focus-soft);
    --focus-ring: #d1553a;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #16130f;
      --panel: #201c17;
      --ink: #efe9df;
      --muted: #9a9082;
      --hair: #322c24;
      --track: #2c2720;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 50px rgba(0,0,0,.4);
      --focus: #e8724f;
      --focus-soft: #3a241d;
      --short: #52b39f;
      --short-soft: #1c332e;
      --long: #6a9bd8;
      --long-soft: #1e2a3a;
      --focus-ring: #e8724f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16130f;
    --panel: #201c17;
    --ink: #efe9df;
    --muted: #9a9082;
    --hair: #322c24;
    --track: #2c2720;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 50px rgba(0,0,0,.4);
    --focus: #e8724f;
    --focus-soft: #3a241d;
    --short: #52b39f;
    --short-soft: #1c332e;
    --long: #6a9bd8;
    --long-soft: #1e2a3a;
    --focus-ring: #e8724f;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 26px 26px 30px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand h1 {
    font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em;
  }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); align-self: center;
    box-shadow: 0 0 0 4px var(--accent-soft);
    transition: background .3s, box-shadow .3s;
  }
  .rounds {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; color: var(--muted);
    letter-spacing: .02em;
  }
  .rounds b { color: var(--ink); font-weight: 600; }

  /* mode tabs */
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--hair);
    border-radius: 13px;
    padding: 5px;
  }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: 0; border-radius: 9px;
    padding: 9px 4px;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  /* dial */
  .dial { position: relative; display: grid; place-items: center; padding: 6px 0; }
  .dial svg { transform: rotate(-90deg); width: 260px; height: 260px; max-width: 100%; }
  .dial .track-ring { stroke: var(--track); }
  .dial .prog-ring {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke .3s;
  }
  .readout {
    position: absolute; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .time {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 60px; font-weight: 600; line-height: 1;
    letter-spacing: -.02em;
  }
  .phase {
    font-size: 11px; text-transform: uppercase; letter-spacing: .16em;
    color: var(--muted); font-weight: 600;
  }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .btn {
    font: inherit; cursor: pointer; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .06s ease, background .2s, border-color .2s, color .2s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent); color: #fff;
    border: 0; padding: 14px 40px;
    font-size: 16px; font-weight: 600;
    letter-spacing: .01em;
    min-width: 150px;
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--hair);
    padding: 13px 16px; font-size: 14px; font-weight: 500;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  /* settings footer */
  .settings {
    border-top: 1px solid var(--hair);
    padding-top: 18px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .setting { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .setting label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 600;
  }
  .stepper {
    display: flex; align-items: center; gap: 2px;
    background: var(--bg); border: 1px solid var(--hair); border-radius: 10px;
    padding: 3px;
  }
  .stepper button {
    font: inherit; width: 26px; height: 26px; border: 0; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 16px;
    line-height: 1; display: grid; place-items: center;
  }
  .stepper button:hover { background: var(--panel); color: var(--ink); }
  .stepper .val {
    font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 600; min-width: 26px; text-align: center;
  }

  .toprow { display: flex; align-items: center; gap: 14px; }
  .icon-btn {
    background: transparent; border: 0; cursor: pointer; color: var(--muted);
    padding: 4px; border-radius: 8px; line-height: 0;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn[aria-pressed="false"] { opacity: .5; }
  .icon-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  /* ---- focus radio ---- */
  .sound-sec {
    border-top: 1px solid var(--hair);
    padding-top: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sound-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sound-head .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 600;
  }
  .sound-head .status {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted);
  }
  .sound-head .status b { color: var(--accent); font-weight: 600; }
  .pills { display: flex; gap: 6px; flex: none; }
  .pill {
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--muted); background: var(--bg);
    border: 1px solid var(--hair); border-radius: 999px;
    padding: 7px 13px; cursor: pointer;
    transition: color .18s, background .18s, border-color .18s;
  }
  .pill:hover { color: var(--ink); border-color: var(--muted); }
  .pill[aria-pressed="true"] {
    background: var(--accent-soft); color: var(--accent);
    border-color: transparent; font-weight: 600;
  }
  .pill:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .vol { display: flex; align-items: center; gap: 11px; }
  .vol svg { color: var(--muted); flex: none; }
  .vol input[type="range"] {
    flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer;
  }
  .vol input[type="range"]:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; }
  .radio-pick { display: flex; align-items: center; gap: 8px; }
  .radio-pick select {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 8px 10px; cursor: pointer;
    border-radius: 9px; border: 1px solid var(--hair); background: var(--bg); color: var(--ink);
  }
  .radio-pick select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .radio-note { font-size: 12px; line-height: 1.45; color: var(--muted); }

  .hint {
    text-align: center; font-size: 12px; color: var(--muted);
    font-family: "IBM Plex Mono", monospace; letter-spacing: .01em;
  }
  .hint kbd {
    font-family: inherit; background: var(--bg); border: 1px solid var(--hair);
    border-radius: 5px; padding: 1px 6px; font-size: 11px; color: var(--ink);
  }

  /* ---- end-of-timer alarm overlay ---- */
  .alert {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,.6);
    background: color-mix(in srgb, var(--accent) 22%, rgba(0,0,0,.55));
    backdrop-filter: blur(3px);
  }
  .alert.show { display: flex; animation: alertPulse 1.1s ease-in-out infinite; }
  @keyframes alertPulse {
    0%, 100% { background: color-mix(in srgb, var(--accent) 18%, rgba(0,0,0,.5)); }
    50%      { background: color-mix(in srgb, var(--accent) 48%, rgba(0,0,0,.5)); }
  }
  .alert-panel {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35), 0 0 0 6px var(--accent-soft);
    padding: 34px 28px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: alertPop .3s ease-out both;
  }
  @keyframes alertPop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .alert-icon {
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; margin-bottom: 6px;
    animation: bell .9s ease-in-out infinite;
    transform-origin: top center;
  }
  @keyframes bell {
    0%, 60%, 100% { transform: rotate(0); }
    10%, 30%, 50% { transform: rotate(11deg); }
    20%, 40%      { transform: rotate(-11deg); }
  }
  .alert-panel h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .alert-panel p { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .alert-panel .btn-primary { width: 100%; padding: 15px; font-size: 16px; }
  .alert-panel .dismiss-note {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); margin-top: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    .alert.show { animation: none; }
    .alert-icon { animation: none; }
    .alert-panel { animation: none; }
  }

  @media (max-width: 380px) {
    .time { font-size: 50px; }
    .dial svg { width: 220px; height: 220px; }
    .btn-primary { padding: 14px 28px; min-width: 130px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .dial .prog-ring, .brand .dot { transition: none; }
  }
</style>
</head>
<body>

<div class="card" id="app">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Study Pomodoro</h1>
    </div>
    <div class="toprow">
      <div class="rounds">Round <b id="roundNum">1</b> · <b id="doneCount">0</b> done</div>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Toggle end-of-timer alarm" aria-label="Toggle end-of-timer alarm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Timer mode">
    <button role="tab" data-mode="focus" aria-selected="true">Focus</button>
    <button role="tab" data-mode="short" aria-selected="false">Short break</button>
    <button role="tab" data-mode="long" aria-selected="false">Long break</button>
  </div>

  <div class="dial">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <circle class="track-ring" cx="130" cy="130" r="116" fill="none" stroke-width="12"/>
      <circle class="prog-ring" id="ring" cx="130" cy="130" r="116" fill="none" stroke-width="12"/>
    </svg>
    <div class="readout">
      <div class="time" id="time" aria-live="polite">25:00</div>
      <div class="phase" id="phase">Focus time</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">Start</button>
    <button class="btn btn-ghost" id="skipBtn" title="Skip to next" aria-label="Skip to next">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    <button class="btn btn-ghost" id="resetBtn" title="Reset" aria-label="Reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="settings">
    <div class="setting">
      <label for="focusMin">Focus</label>
      <div class="stepper">
        <button data-adj="focus" data-d="-1" aria-label="Less focus minutes">–</button>
        <span class="val" id="focusMin">25</span>
        <button data-adj="focus" data-d="1" aria-label="More focus minutes">+</button>
      </div>
    </div>
    <div class="setting">
      <label for="shortMin">Short</label>
      <div class="stepper">
        <button data-adj="short" data-d="-1" aria-label="Less short break minutes">–</button>
        <span class="val" id="shortMin">5</span>
        <button data-adj="short" data-d="1" aria-label="More short break minutes">+</button>
      </div>
    </div>
    <div class="setting">
      <label for="longMin">Long</label>
      <div class="stepper">
        <button data-adj="long" data-d="-1" aria-label="Less long break minutes">–</button>
        <span class="val" id="longMin">15</span>
        <button data-adj="long" data-d="1" aria-label="More long break minutes">+</button>
      </div>
    </div>
  </div>

  <div class="sound-sec">
    <div class="sound-head">
      <span class="lbl">Focus radio</span>
      <span class="status" id="soundStatus">plays while focusing</span>
    </div>
    <div class="radio-pick">
      <div class="pills" role="group" aria-label="Focus radio">
        <button class="pill" data-radio="off" aria-pressed="true">Off</button>
        <button class="pill" data-radio="on" aria-pressed="false">On</button>
      </div>
      <select id="radioStation" aria-label="Radio station">
        <optgroup label="SomaFM">
          <option value="groove">Groove Salad — chilled beats</option>
          <option value="fluid">Fluid — instrumental hip-hop</option>
          <option value="beatblend">Beat Blender — downtempo</option>
          <option value="drone">Drone Zone — deep ambient</option>
          <option value="deepspace">Deep Space One — space ambient</option>
        </optgroup>
        <optgroup label="Radio Paradise">
          <option value="rparadise">Mellow Mix — curated, lossless-grade</option>
        </optgroup>
        <optgroup label="Nightride FM">
          <option value="nightride">Chillsynth — chillwave / synth</option>
        </optgroup>
      </select>
    </div>
    <div class="vol">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="Radio volume">
    </div>
    <div id="radioNote" class="radio-note" role="status" hidden></div>
  </div>

  <div class="hint"><kbd>Space</kbd> start / pause &nbsp;·&nbsp; long break every 4th round</div>
</div>


<audio id="radioAudio" preload="none"></audio>

<div class="alert" id="alert" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertMsg">
  <div class="alert-panel">
    <div class="alert-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <h2 id="alertTitle">Time's up!</h2>
    <p id="alertMsg">Focus session complete — take a break.</p>
    <button class="btn btn-primary" id="alertBtn">Start short break</button>
    <div class="dismiss-note">press <kbd style="all:unset;font-weight:600">Space</kbd> or <kbd style="all:unset;font-weight:600">Enter</kbd> to dismiss</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULTS = { focus: 25, short: 5, long: 15 };
  var LABELS = { focus: "Focus time", short: "Short break", long: "Long break" };
  var LONG_EVERY = 4;

  var state = {
    mode: "focus",
    mins: Object.assign({}, DEFAULTS),
    remaining: DEFAULTS.focus * 60 * 1000,
    running: false,
    endAt: 0,
    round: 1,       // current focus round (1..)
    completed: 0,   // focus sessions finished
    sound: true,    // end-of-timer alarm on/off
    radio: false,   // focus radio on/off
    vol: 0.55,      // radio volume 0..1
    station: "groove" // radio station key
  };

  // ---- persistence (per-viewer convenience; safe if blocked) ----
  function save() {
    try {
      localStorage.setItem("studyPomodoro", JSON.stringify({
        mins: state.mins, completed: state.completed, round: state.round,
        sound: state.sound, radio: state.radio, vol: state.vol, station: state.station
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem("studyPomodoro");
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d.mins) state.mins = Object.assign({}, DEFAULTS, d.mins);
      if (typeof d.completed === "number") state.completed = d.completed;
      if (typeof d.round === "number") state.round = d.round;
      if (typeof d.sound === "boolean") state.sound = d.sound;
      if (typeof d.radio === "boolean") state.radio = d.radio;
      else if (d.scape === "radio") state.radio = true;   // saved by the old soundscape picker
      if (typeof d.vol === "number") state.vol = Math.min(1, Math.max(0, d.vol));
      if (typeof d.station === "string" && RADIO[d.station]) state.station = d.station;
    } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var timeEl = $("time"), phaseEl = $("phase"), ring = $("ring"),
      startBtn = $("startBtn"), roundNumEl = $("roundNum"), doneEl = $("doneCount"),
      soundBtn = $("soundBtn"), app = $("app"),
      alertEl = $("alert"), alertBtn = $("alertBtn"),
      volEl = $("vol"), soundStatus = $("soundStatus");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tabs button"));
  var radioBtns = Array.prototype.slice.call(document.querySelectorAll(".pill"));
  var alertOpen = false;

  var R = 116, CIRC = 2 * Math.PI * R;
  ring.style.strokeDasharray = CIRC.toFixed(1);

  function total() { return state.mins[state.mode] * 60 * 1000; }

  function setAccent() {
    var map = {
      focus: ["var(--focus)", "var(--focus-soft)"],
      short: ["var(--short)", "var(--short-soft)"],
      long:  ["var(--long)",  "var(--long-soft)"]
    };
    app.style.setProperty("--accent", map[state.mode][0]);
    app.style.setProperty("--accent-soft", map[state.mode][1]);
  }

  function fmt(ms) {
    if (ms < 0) ms = 0;
    var s = Math.round(ms / 1000);
    var m = Math.floor(s / 60);
    var ss = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
  }

  function render() {
    timeEl.textContent = fmt(state.remaining);
    phaseEl.textContent = LABELS[state.mode];
    var frac = 1 - Math.min(1, Math.max(0, state.remaining / total()));
    ring.style.strokeDashoffset = (CIRC * frac).toFixed(1);
    startBtn.textContent = state.running ? "Pause" : (state.remaining < total() ? "Resume" : "Start");
    roundNumEl.textContent = state.round;
    doneEl.textContent = state.completed;
    tabs.forEach(function (t) {
      t.setAttribute("aria-selected", t.dataset.mode === state.mode ? "true" : "false");
    });
    document.title = (state.running || state.remaining < total())
      ? fmt(state.remaining) + " · " + LABELS[state.mode]
      : "Study Pomodoro";
  }

  function renderSoundUI() {
    radioBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", (b.dataset.radio === "on") === state.radio ? "true" : "false");
    });
    volEl.value = Math.round(state.vol * 100);
    var name = (RADIO[state.station] || RADIO.groove).name;
    if (!state.radio) {
      soundStatus.textContent = "plays while focusing";
    } else if (radioFailed) {
      soundStatus.innerHTML = "<b>" + name + "</b> · couldn't connect";
    } else if (radioPlaying) {
      soundStatus.innerHTML = "playing <b>" + name + "</b>";
    } else {
      soundStatus.innerHTML = "<b>" + name + "</b> · starts with focus";
    }
  }

  var raf = null;
  function tick() {
    if (!state.running) return;
    state.remaining = state.endAt - Date.now();
    if (state.remaining <= 0) {
      state.remaining = 0;
      render();
      complete();
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (state.running) return;
    if (state.remaining <= 0) state.remaining = total();
    state.endAt = Date.now() + state.remaining;
    state.running = true;
    render();
    if (state.mode === "focus") startRadio();
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    state.running = false;
    if (raf) cancelAnimationFrame(raf);
    state.remaining = state.endAt - Date.now();
    if (state.remaining < 0) state.remaining = 0;
    stopRadio();
    render();
  }
  function toggle() { state.running ? pause() : start(); }

  function setMode(mode) {
    state.mode = mode;
    state.running = false;
    if (raf) cancelAnimationFrame(raf);
    state.remaining = total();
    stopRadio();
    setAccent();
    render();
  }

  // Move to the next phase. `alarm` = raise the full alarm (timer ran out);
  // false = a manual skip, which just advances quietly.
  function advance(alarm) {
    state.running = false;
    if (raf) cancelAnimationFrame(raf);
    var finished = state.mode, msg, btnLabel, nextMode;
    if (finished === "focus") {
      state.completed += 1;
      nextMode = (state.round % LONG_EVERY === 0) ? "long" : "short";
      msg = "Focus session complete — time for a " + (nextMode === "long" ? "long" : "short") + " break.";
      btnLabel = "Start " + (nextMode === "long" ? "long break" : "short break");
    } else {
      if (finished === "long") state.round = 1; else state.round += 1;
      nextMode = "focus";
      msg = "Break's over — ready to focus again?";
      btnLabel = "Start focus";
    }
    setMode(nextMode);   // also stops the radio so the alarm is clear
    save();
    if (alarm) showAlert(msg, btnLabel);
  }
  function complete() { advance(true); }

  function reset() {
    state.running = false;
    if (raf) cancelAnimationFrame(raf);
    state.remaining = total();
    stopRadio();
    render();
  }

  // ===================================================================
  //  ALARM — generated in-browser (Web Audio API), no external files
  // ===================================================================
  var actx = null, alarmTimer = null;
  function ensureCtx() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return true;
    } catch (e) { return false; }
  }

  // ---- end-of-timer alarm : repeats until dismissed ----
  function beepBurst() {
    if (!actx) return;
    var pattern = [880, 1175, 880];
    pattern.forEach(function (f, i) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      var t = actx.currentTime + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.34);
    });
  }
  function startAlarm() {
    if (!state.sound || !ensureCtx()) return;
    beepBurst();
    var n = 0;
    alarmTimer = setInterval(function () {
      beepBurst();
      if (++n > 40) stopAlarm();
    }, 1400);
  }
  function stopAlarm() {
    if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  }

  // ---- focus radio : <audio> stream, each station has a fallback URL ----
  var radioAudio = $("radioAudio"), radioStation = $("radioStation"), radioNote = $("radioNote");
  var radioPlaying = false, radioAltTried = false, radioFailed = false;
  // SomaFM answers 403 when the Referer host is localhost / *.localhost (not 127.0.0.1)
  var ON_LOCALHOST = /(^|\.)localhost$/.test(location.hostname);
  var RADIO = {
    groove:    { name: "Groove Salad",     urls: ["https://ice5.somafm.com/groovesalad-128-mp3", "https://ice2.somafm.com/groovesalad-128-mp3"] },
    fluid:     { name: "Fluid",            urls: ["https://ice5.somafm.com/fluid-128-mp3",        "https://ice2.somafm.com/fluid-128-mp3"] },
    beatblend: { name: "Beat Blender",     urls: ["https://ice5.somafm.com/beatblender-128-mp3",  "https://ice2.somafm.com/beatblender-128-mp3"] },
    drone:     { name: "Drone Zone",       urls: ["https://ice5.somafm.com/dronezone-128-mp3",    "https://ice6.somafm.com/dronezone-128-mp3"] },
    deepspace: { name: "Deep Space One",   urls: ["https://ice5.somafm.com/deepspaceone-128-mp3", "https://ice6.somafm.com/deepspaceone-128-mp3"] },
    rparadise: { name: "RP Mellow Mix",    urls: ["https://stream.radioparadise.com/mellow-128",  "https://stream.radioparadise.com/mellow-192"] },
    nightride: { name: "Chillsynth FM",    urls: ["https://stream.nightride.fm/chillsynth.mp3",   "https://stream.nightride.fm/chillsynth.ogg"] }
  };

  function startRadio() {
    if (!state.radio || radioPlaying) return;
    var st = RADIO[state.station] || RADIO.groove;
    radioAltTried = false; radioFailed = false;
    radioNote.hidden = false; radioNote.textContent = "Connecting to " + st.name + "…";
    try {
      radioAudio.src = st.urls[0];
      radioAudio.volume = state.vol;
      var rp = radioAudio.play();
      if (rp && rp.catch) rp.catch(function () {});
    } catch (e) {}
    radioPlaying = true;
    renderSoundUI();
  }

  function stopRadio() {
    if (!radioPlaying) return;
    try { radioAudio.pause(); radioAudio.removeAttribute("src"); radioAudio.load(); } catch (e) {}
    radioPlaying = false; radioFailed = false;
    radioNote.hidden = true;
    renderSoundUI();
  }

  function applyVolume() {
    try { radioAudio.volume = state.vol; } catch (e) {}
  }

  // ---- browser notification (works when the tab isn't focused) ----
  function ensureNotify() {
    try {
      if (window.Notification && Notification.permission === "default") Notification.requestPermission();
    } catch (e) {}
  }
  function notify(msg) {
    try {
      if (window.Notification && Notification.permission === "granted") {
        var nt = new Notification("Study Pomodoro — Time's up!", { body: msg, tag: "pomodoro" });
        setTimeout(function () { try { nt.close(); } catch (e) {} }, 8000);
      }
    } catch (e) {}
  }

  // ---- flashing tab title ----
  var titleFlash = null;
  function startTitleFlash() {
    var on = true;
    document.title = "⏰ Time's up!";
    titleFlash = setInterval(function () {
      document.title = on ? "🔔 " + LABELS[state.mode] + " ready" : "⏰ Time's up!";
      on = !on;
    }, 900);
  }
  function stopTitleFlash() {
    if (titleFlash) { clearInterval(titleFlash); titleFlash = null; }
  }

  // ---- alert overlay ----
  function showAlert(msg, btnLabel) {
    $("alertMsg").textContent = msg;
    alertBtn.textContent = btnLabel;
    alertEl.classList.add("show");
    alertOpen = true;
    startAlarm();
    notify(msg);
    startTitleFlash();
    setTimeout(function () { try { alertBtn.focus(); } catch (e) {} }, 60);
  }
  function dismissAlert(andStart) {
    if (!alertOpen) return;
    alertOpen = false;
    alertEl.classList.remove("show");
    stopAlarm();
    stopTitleFlash();
    if (andStart) start(); else render();
  }

  // ---- wiring ----
  startBtn.addEventListener("click", function () {
    ensureCtx();      // unlock audio on a user gesture
    ensureNotify();   // ask once for notification permission
    toggle();
  });
  $("skipBtn").addEventListener("click", function () { advance(false); });
  $("resetBtn").addEventListener("click", reset);
  alertBtn.addEventListener("click", function () { dismissAlert(true); });
  alertEl.addEventListener("click", function (e) { if (e.target === alertEl) dismissAlert(false); });

  tabs.forEach(function (t) {
    t.addEventListener("click", function () { setMode(t.dataset.mode); });
  });

  document.querySelectorAll(".stepper button").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.dataset.adj, d = parseInt(b.dataset.d, 10);
      var v = state.mins[key] + d;
      if (v < 1) v = 1;
      if (v > 90) v = 90;
      state.mins[key] = v;
      $(key + "Min").textContent = v;
      if (state.mode === key && !state.running) state.remaining = total();
      render();
      save();
    });
  });

  soundBtn.addEventListener("click", function () {
    state.sound = !state.sound;
    soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
    save();
  });

  radioBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      state.radio = b.dataset.radio === "on";
      // If a focus session is running, switch live; otherwise just arm it.
      if (state.running && state.mode === "focus") {
        if (state.radio) startRadio(); else stopRadio();
      }
      save();
      renderSoundUI();
    });
  });

  volEl.addEventListener("input", function () {
    state.vol = parseInt(volEl.value, 10) / 100;
    applyVolume();
    save();
  });

  document.addEventListener("keydown", function (e) {
    if (alertOpen) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "Escape") {
        e.preventDefault();
        dismissAlert(e.code !== "Escape");
      }
      return;
    }
    if (e.code === "Space" && e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") {
      e.preventDefault();
      ensureCtx();
      toggle();
    }
  });

  // ---- radio wiring ----
  radioStation.addEventListener("change", function () {
    state.station = radioStation.value; save();
    if (radioPlaying) { stopRadio(); startRadio(); }
    renderSoundUI();
  });
  radioAudio.addEventListener("playing", function () {
    radioNote.hidden = false; radioNote.textContent = "Now playing: " + ((RADIO[state.station] || {}).name || "radio");
  });
  radioAudio.addEventListener("error", function () {
    var st = RADIO[state.station];
    if (!radioPlaying) return;
    if (st && !radioAltTried && st.urls[1]) {
      radioAltTried = true;
      try { radioAudio.src = st.urls[1]; radioAudio.play().catch(function () {}); } catch (e) {}
    } else {
      radioFailed = true;
      radioNote.hidden = false;
      radioNote.textContent = (ON_LOCALHOST && st && /\.somafm\.com\//.test(st.urls[0]))
        ? "SomaFM blocks localhost, so this station only plays on the deployed site. Radio Paradise and Nightride work here."
        : "Couldn't reach this station \u2014 try another.";
      renderSoundUI();
    }
  });

  // ---- init ----
  load();
  ["focus", "short", "long"].forEach(function (k) { $(k + "Min").textContent = state.mins[k]; });
  soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
  radioStation.value = state.station;
  state.remaining = total();
  setAccent();
  render();
  renderSoundUI();
})();
</script>

</body>
</html>
